# Read the Docs build. The conda environment provides igraph and the other
# packages the API pages import; the package itself is read from the
# repository, so the Cython extensions are not compiled.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "mambaforge-22.9"

conda:
  environment: environment.yml

python:
  install:
    - requirements: Documentation/requirements.txt

sphinx:
  configuration: Documentation/source/conf.py
  fail_on_warning: true
