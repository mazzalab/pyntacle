# Conda environment for Pyntacle.
#
#   conda env create -f environment.yml
#   conda activate pyntacle
#   pip install .
#
# On macOS also run `conda install llvm-openmp` in the environment, so the
# compiled kernels run in parallel (-np).
name: pyntacle
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - c-compiler
  - cython>=3.0
  - python-igraph=0.10
  - numpy
  - pandas
  - matplotlib
  - pycairo
  - pygraphviz
  - plotly
  - colorama
  # pyntacle omics
  - scipy
  - scikit-learn
  - statsmodels
  # test suite
  - pytest
  # benchmarks/ (resource sampling)
  - psutil
